<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="16 8" transform="rotate(-28 256 256)" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="170" ry="58" fill="none" stroke="url(#ringGrad)" stroke-width="14" transform="rotate(-28 256 256)" filter="url(#glow)"/>

  <!-- Main Planet Body -->
  <circle cx="256" cy="256" r="95" fill="url(#planetGrad)" filter="url(#glow)"/>

  <!-- Academic Cap / Star Accents -->
  <circle cx="160" cy="150" r="6" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="370" cy="130" r="4" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="120" cy="360" r="5" fill="#F8FAFC" opacity="0.7"/>
  <circle cx="390" cy="380" r="7" fill="#F8FAFC" opacity="0.85"/>
  <polygon points="256,190 286,206 256,222 226,206" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 240 216 L 240 236 Q 256 244 272 236 L 272 216" fill="#FFFFFF" opacity="0.85"/>
</svg>
